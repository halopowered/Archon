name: auto-fix-conflict
description: |
  Use when: a Dependabot PR has a LOCKFILE merge conflict with the base branch
  and you want to resolve it automatically by regenerating the lockfile.

  Triggers (run): "auto-fix conflict", "resolve lockfile conflict".

  Input (from $ARGUMENTS): a single Dependabot PR number, e.g. "57".

  Does:
  - Validates the PR is a Dependabot PR
  - Identifies the project folder + package manager (npm / pnpm / yarn / bun)
  - Checks out the PR head, merges the base branch
  - If ONLY lockfile(s) conflict: regenerates the lockfile with the package
    manager (the mechanical resolution), then verifies build + test
  - On success: opens a replacement PR (base merged + regenerated lockfile),
    auto-approves and squash-merges, comments on the original PR
  - If package.json / source files conflict, or build/test fails after regen:
    comments and stops (needs a human)

  NOT for: install/lint/build failures (use auto-fix-install / auto-fix-lint),
           non-Dependabot PRs, non-lockfile conflicts.

nodes:
  # ── Step 1: Fetch + validate the PR ───────────────────────────────────
  - id: fetch-pr
    bash: |
      #!/bin/bash
      set -u
      ARG=$(echo "$ARGUMENTS" | awk '{$1=$1};1')
      PR_NUMBER=$(echo "$ARG" | grep -oE '[0-9]+' | head -1)
      if [ -z "$PR_NUMBER" ]; then
        echo "Provide a PR number, e.g. \"57\" or \"#57\"." \
          > "$ARTIFACTS_DIR/error.txt"
        echo "INVALID_INPUT"; exit 0
      fi

      PR_FIELDS='number,title,author,headRefName,baseRefName,mergeable'
      if ! pr=$(gh pr view "$PR_NUMBER" --json "$PR_FIELDS" 2>/dev/null); then
        echo "Could not fetch PR #$PR_NUMBER (does it exist on this repo?)" \
          > "$ARTIFACTS_DIR/error.txt"
        echo "PR_NOT_FOUND"; exit 0
      fi

      author=$(echo "$pr" | jq -r '.author.login')
      case "$author" in
        'dependabot[bot]'|app/dependabot|dependabot)
          echo "$pr" > "$ARTIFACTS_DIR/pr.json"
          echo "$pr"
          ;;
        *)
          echo "PR #$PR_NUMBER is authored by '$author', not Dependabot." \
            > "$ARTIFACTS_DIR/error.txt"
          echo "NOT_A_DEPENDABOT_PR"
          ;;
      esac
    timeout: 15000

  # ── Step 2: Single gate that routes on validation result ──────────────
  - id: gate-fetch
    depends_on: [fetch-pr]
    bash: |
      OUTPUT=$fetch-pr.output
      case "$OUTPUT" in
        INVALID_INPUT|PR_NOT_FOUND|NOT_A_DEPENDABOT_PR|"")
          echo "ERROR"
          ;;
        *)
          echo "PROCEED"
          ;;
      esac
    timeout: 5000

  - id: report-fetch-error
    depends_on: [fetch-pr, gate-fetch]
    when: "$gate-fetch.output == 'ERROR'"
    bash: |
      OUTPUT=$fetch-pr.output
      case "$OUTPUT" in
        INVALID_INPUT)        STATUS="AUTOFIX_CONFLICT_INVALID_INPUT" ;;
        PR_NOT_FOUND)         STATUS="AUTOFIX_CONFLICT_PR_NOT_FOUND" ;;
        NOT_A_DEPENDABOT_PR)  STATUS="AUTOFIX_CONFLICT_NOT_DEPENDABOT" ;;
        *)                    STATUS="AUTOFIX_CONFLICT_UNKNOWN_ERROR" ;;
      esac
      echo "$STATUS" > "$ARTIFACTS_DIR/status.txt"

      echo "❌ auto-fix-conflict:"
      cat "$ARTIFACTS_DIR/error.txt"
    timeout: 5000

  # ── Step 3: Identify the project folder ───────────────────────────────
  - id: identify-folder
    depends_on: [fetch-pr, gate-fetch]
    when: "$gate-fetch.output == 'PROCEED'"
    bash: |
      #!/bin/bash
      set -eu
      PR_NUMBER=$(jq -r '.number' "$ARTIFACTS_DIR/pr.json")
      files=$(gh pr diff "$PR_NUMBER" --name-only 2>/dev/null || true)
      if [ -z "$files" ]; then
        echo "."
        exit 0
      fi
      echo "$files" | awk -F/ '
        NR == 1 {
          common_n = NF - 1
          for (i = 1; i <= common_n; i++) prefix[i] = $i
          next
        }
        {
          max_check = (NF - 1 < common_n ? NF - 1 : common_n)
          new_common = 0
          for (i = 1; i <= max_check; i++) {
            if (prefix[i] != $i) break
            new_common = i
          }
          common_n = new_common
        }
        END {
          if (common_n == 0) { print "."; exit }
          out = prefix[1]
          for (i = 2; i <= common_n; i++) out = out "/" prefix[i]
          print out
        }
      '
    timeout: 30000

  # ── Step 4: Checkout the PR's head branch ─────────────────────────────
  - id: checkout-pr-branch
    depends_on: [fetch-pr, gate-fetch]
    when: "$gate-fetch.output == 'PROCEED'"
    bash: |
      set -e
      PR_NUMBER=$(jq -r '.number' "$ARTIFACTS_DIR/pr.json")
      # Detached HEAD avoids "refusing to fetch into branch checked out at
      # <other worktree>" and keeps git's tracking output off this node's stdout.
      git fetch origin "pull/$PR_NUMBER/head" >/dev/null 2>&1
      git checkout FETCH_HEAD >/dev/null 2>&1
      echo "detached-at-pr-$PR_NUMBER"
    timeout: 60000

  # ── Step 5: Merge base + regenerate the conflicted lockfile ───────────
  # Outputs (one of):
  #   FIXED               — lockfile-only conflict resolved, build + test pass
  #   NO_FIX_AVAILABLE    — non-lockfile conflict, no lockfile, unknown PM, or
  #                         build/test failed after regen
  - id: attempt-conflict-fix
    depends_on: [identify-folder, checkout-pr-branch]
    bash: |
      #!/bin/bash
      set -u
      FOLDER=$identify-folder.output
      BASE=$(jq -r '.baseRefName' "$ARTIFACTS_DIR/pr.json")

      log_diag() { echo "$1" >> "$ARTIFACTS_DIR/diagnostic.txt"; }

      LOCKFILES='package-lock.json pnpm-lock.yaml yarn.lock npm-shrinkwrap.json bun.lockb'

      # Detect the package manager from the lockfile present in the folder.
      detect_pm() {
        if [ -f "$FOLDER/pnpm-lock.yaml" ]; then echo "corepack pnpm"; return; fi
        if [ -f "$FOLDER/yarn.lock" ]; then echo "corepack yarn"; return; fi
        if [ -f "$FOLDER/bun.lockb" ]; then echo "bun"; return; fi
        if [ -f "$FOLDER/package-lock.json" ] || [ -f "$FOLDER/npm-shrinkwrap.json" ]; then echo "npm"; return; fi
        echo ""
      }
      PM=$(detect_pm)
      if [ -z "$PM" ]; then
        log_diag "No recognizable lockfile in '$FOLDER' — conflict auto-fix only handles npm/pnpm/yarn/bun projects."
        echo "NO_FIX_AVAILABLE"; exit 0
      fi
      command -v corepack >/dev/null 2>&1 && corepack enable >/dev/null 2>&1 || true

      git config user.email "${GIT_AUTHOR_EMAIL:-archon-bot@users.noreply.github.com}" 2>/dev/null || true
      git config user.name "${GIT_AUTHOR_NAME:-Archon Bot}" 2>/dev/null || true

      # Merge the base branch into the PR head. Conflicts expected (the lockfile).
      git fetch origin "$BASE" >/dev/null 2>&1
      git merge --no-commit --no-ff "origin/$BASE" > "$ARTIFACTS_DIR/merge.log" 2>&1
      merge_rc=$?

      conflicts=$(git diff --name-only --diff-filter=U)
      if [ -z "$conflicts" ]; then
        # No conflicts (merge clean or fast-forward). Nothing for THIS workflow
        # to do — let the normal verify/merge path handle it.
        git merge --abort 2>/dev/null || true
        log_diag "No merge conflicts against $BASE — not a conflict case."
        echo "NO_FIX_AVAILABLE"; exit 0
      fi

      # Any conflict outside a lockfile → can't mechanically resolve. Escalate.
      non_lock=$(echo "$conflicts" | grep -vE "(^|/)($(echo "$LOCKFILES" | tr ' ' '|'))$" || true)
      if [ -n "$non_lock" ]; then
        git merge --abort 2>/dev/null || true
        log_diag "Conflicts outside the lockfile (need human resolution):"
        log_diag "$non_lock"
        echo "NO_FIX_AVAILABLE"; exit 0
      fi

      # Lockfile-only conflict. Take the BASE lockfile, keep the merged
      # package.json (carries the dep bump), then regenerate via the PM.
      echo "$conflicts" | while IFS= read -r lf; do
        [ -n "$lf" ] && git checkout --theirs -- "$lf" 2>/dev/null && git add "$lf"
      done

      if [ ! -f "$FOLDER/package.json" ]; then
        git merge --abort 2>/dev/null || true
        log_diag "No package.json in '$FOLDER'."
        echo "NO_FIX_AVAILABLE"; exit 0
      fi

      ( cd "$FOLDER" && $PM install --legacy-peer-deps ) > "$ARTIFACTS_DIR/install.log" 2>&1 \
        || ( cd "$FOLDER" && $PM install ) >> "$ARTIFACTS_DIR/install.log" 2>&1
      if [ $? -ne 0 ]; then
        git merge --abort 2>/dev/null || true
        log_diag "Lockfile regeneration ($PM install) failed. See install.log."
        echo "NO_FIX_AVAILABLE"; exit 0
      fi

      # Verify the regenerated tree builds + tests (safety gate before merge).
      if ! ( cd "$FOLDER" && $PM run build --if-present ) > "$ARTIFACTS_DIR/build.log" 2>&1; then
        git merge --abort 2>/dev/null || true
        log_diag "Build failed after regenerating the lockfile. See build.log."
        echo "NO_FIX_AVAILABLE"; exit 0
      fi
      if ! ( cd "$FOLDER" && $PM test --if-present -- --watch=false --browsers=ChromeHeadless ) \
           > "$ARTIFACTS_DIR/test.log" 2>&1; then
        git merge --abort 2>/dev/null || true
        log_diag "Tests failed after regenerating the lockfile. See test.log."
        echo "NO_FIX_AVAILABLE"; exit 0
      fi

      # Stage the regenerated lockfile(s) and record the package manager.
      git add -A "$FOLDER"
      echo "$PM" > "$ARTIFACTS_DIR/pm.txt"
      echo "FIXED"
    timeout: 600000

  # ── Step 6a: Commit the resolution, open replacement PR + merge ───────
  - id: open-fix-pr-and-merge
    depends_on: [attempt-conflict-fix, fetch-pr, identify-folder]
    when: "$attempt-conflict-fix.output == 'FIXED'"
    bash: |
      set -e
      echo "AUTOFIX_CONFLICT_MERGE_FAILED" > "$ARTIFACTS_DIR/status.txt"

      PR_NUMBER=$(jq -r '.number' "$ARTIFACTS_DIR/pr.json")
      ORIG_TITLE=$(jq -r '.title' "$ARTIFACTS_DIR/pr.json")
      BASE=$(jq -r '.baseRefName' "$ARTIFACTS_DIR/pr.json")
      PM=$(cat "$ARTIFACTS_DIR/pm.txt" 2>/dev/null || echo "the package manager")
      FIX_BRANCH="fix/conflict-pr-$PR_NUMBER"

      # The in-progress merge + regenerated lockfile are staged. Commit on a new
      # branch (it already incorporates the base merge, so it's mergeable).
      git checkout -B "$FIX_BRANCH"
      if git diff --cached --quiet && git diff --quiet; then
        echo "❌ Nothing staged to commit (unexpected after FIXED)."; exit 1
      fi
      git commit --no-edit -m "fix: resolve lockfile conflict with $BASE for Dependabot PR #$PR_NUMBER" || \
        git commit -m "fix: resolve lockfile conflict with $BASE for Dependabot PR #$PR_NUMBER"
      git push -u origin "$FIX_BRANCH" >/dev/null 2>&1

      PR_BODY_FILE="$ARTIFACTS_DIR/replacement-pr-body.md"
      {
        echo "## Summary"
        echo ""
        echo "Replaces Dependabot PR #$PR_NUMBER. Same dependency bump, with the"
        echo "lockfile merge conflict against \`$BASE\` resolved by regenerating it"
        echo "with \`$PM\`."
        echo ""
        echo "Verified locally in the Archon worktree: lockfile regenerated, build ✅, test ✅."
        echo ""
        echo "Auto-generated by the \`auto-fix-conflict\` Archon workflow."
      } > "$PR_BODY_FILE"

      OWNER_REPO=$(gh repo view --json nameWithOwner -q .nameWithOwner)
      NEW_PR_JSON=$(gh api -X POST "repos/$OWNER_REPO/pulls" \
        -f title="$ORIG_TITLE" \
        -F body=@"$PR_BODY_FILE" \
        -f head="$FIX_BRANCH" \
        -f base="$BASE")
      NEW_PR_NUMBER=$(echo "$NEW_PR_JSON" | jq -r '.number')
      new_pr_url=$(echo "$NEW_PR_JSON" | jq -r '.html_url')
      echo "📬 Opened replacement PR: $new_pr_url (#$NEW_PR_NUMBER)"

      gh api -X POST "repos/$OWNER_REPO/pulls/$NEW_PR_NUMBER/reviews" \
        -f event=APPROVE \
        -f body="Lockfile conflict resolved + verified locally (build + test green)." \
        >/dev/null 2>&1 || echo "  (approve failed; continuing to merge)"

      gh api -X PUT "repos/$OWNER_REPO/pulls/$NEW_PR_NUMBER/merge" \
        -f merge_method=squash >/dev/null

      gh api -X DELETE "repos/$OWNER_REPO/git/refs/heads/$FIX_BRANCH" 2>/dev/null || true

      echo "AUTOFIX_CONFLICT_MERGED" > "$ARTIFACTS_DIR/status.txt"

      ORIG_COMMENT="🔀 **Lockfile conflict resolved.**

      Replacement PR: $new_pr_url (auto-approved and squash-merged).

      Dependabot will close this PR automatically once the dependency is at the requested version on \`$BASE\`. If it doesn't, this PR can be closed manually."

      gh api -X POST "repos/$OWNER_REPO/issues/$PR_NUMBER/comments" \
        -f body="$ORIG_COMMENT" >/dev/null

      echo "✅ Replacement PR merged: $new_pr_url"
    timeout: 180000

  # ── Step 6b: No mechanical fix — comment with diagnostic ──────────────
  - id: comment-no-fix-available
    depends_on: [attempt-conflict-fix, fetch-pr]
    when: "$attempt-conflict-fix.output == 'NO_FIX_AVAILABLE'"
    bash: |
      set -e
      echo "AUTOFIX_CONFLICT_NO_FIX_AVAILABLE" > "$ARTIFACTS_DIR/status.txt"
      PR_NUMBER=$(jq -r '.number' "$ARTIFACTS_DIR/pr.json")

      DIAG=""
      [ -f "$ARTIFACTS_DIR/diagnostic.txt" ] && DIAG=$(cat "$ARTIFACTS_DIR/diagnostic.txt")

      BODY_FILE="$ARTIFACTS_DIR/no-fix-comment.md"
      {
        echo "🔧 **Conflict auto-fix attempted; no mechanical fix applies.**"
        echo ""
        if [ -n "$DIAG" ]; then
          echo "Diagnostic:"; echo ""; echo '```'; echo "$DIAG"; echo '```'; echo ""
        fi
        echo "Lockfile-only conflicts are auto-resolved by regenerating the lockfile;"
        echo "this PR has conflicts outside the lockfile (or failed verification"
        echo "after regeneration), so it needs a human."
        echo ""
        echo "_Posted by the \`auto-fix-conflict\` Archon workflow._"
      } > "$BODY_FILE"

      OWNER_REPO=$(gh repo view --json nameWithOwner -q .nameWithOwner)
      gh api -X POST "repos/$OWNER_REPO/issues/$PR_NUMBER/comments" \
        -F body=@"$BODY_FILE" >/dev/null
      echo "💬 PR #$PR_NUMBER: posted no-fix-available comment"
    timeout: 30000

  # ── Final: emit the orchestrator-readable status marker ──────────────
  - id: report-status
    depends_on:
      - report-fetch-error
      - open-fix-pr-and-merge
      - comment-no-fix-available
    trigger_rule: all_done
    bash: |
      if [ -f "$ARTIFACTS_DIR/status.txt" ]; then
        STATUS=$(cat "$ARTIFACTS_DIR/status.txt" | tr -d '[:space:]')
      else
        STATUS="AUTOFIX_CONFLICT_UNKNOWN"
      fi
      echo "<<<STATUS:$STATUS>>>"
    timeout: 5000
