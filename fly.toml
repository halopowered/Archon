# fly.toml app configuration file generated for archon-sandbox on 2026-06-11T14:59:14-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'archon-sandbox'
primary_region = 'ord'

[build]

[env]
  # Archon's server defaults to port 3090 when PORT is unset (Fly does not
  # inject PORT automatically) — must match http_service.internal_port.
  PORT = '3000'
  # Fly runs Firecracker microVMs, not Docker, so Archon's isDocker() probe
  # (which looks for WORKSPACE_PATH / HOME=/root) is false here and ARCHON_HOME
  # would fall back to ~/.archon (/home/appuser/.archon). The image + entrypoint
  # are built entirely around /.archon (workspaces, worktrees, git
  # safe.directory, the webhook-host workflow copy + repo clone), so pin it.
  ARCHON_DOCKER = 'true'
  # Repos the webhook-host acts on. The entrypoint clones each into
  # /.archon/checkouts/<repo>; the dependabot server routes each incoming PR to
  # its own checkout by repository.full_name. Space/comma-separated owner/repo.
  # Add a repo here + redeploy to extend coverage.
  WEBHOOK_TARGET_REPOS = 'halopowered/stack-artifacts'
  # Backlog discovery. OFF for now: the server is purely event-driven — only
  # PRs delivered by the GitHub webhook are queued and run. The existing open-PR
  # backlog is NOT scanned or drained (neither on boot nor after each run).
  # Set to '1' (or remove) + redeploy to proactively scan `gh pr list` and drain
  # every open Dependabot PR (minus those already labeled 'archon-reviewed'),
  # one at a time per repo, on boot and after each run completes.
  WEBHOOK_DISCOVERY = '0'
  # The server suppresses webhook events whose sender is the bot login
  # (auto-resolved via `gh api /user` = the PAT owner) to avoid self-induced
  # loops. But the operator IS that identity, so a manual PR *reopen* (a handy
  # way to re-trigger the pipeline) gets suppressed too. Allow self-`reopened`
  # through. Safe: the real loop source (`synchronize` from update-branch) is
  # already filtered by the opened/reopened action allowlist, and the pipeline
  # never reopens PRs itself.
  WEBHOOK_ALLOW_SELF_REOPEN = '1'
  # Git committer identity for the pipeline's commits (auto-fix-lint /
  # auto-fix-install branch commits). appuser has no ~/.gitconfig on Fly, so
  # `git commit` errored "Author identity unknown". git reads these env vars
  # directly (no config file needed). The replacement PRs are squash-merged via
  # the API by the PAT owner, so this author is effectively cosmetic.
  GIT_AUTHOR_NAME = 'Archon Bot'
  GIT_AUTHOR_EMAIL = 'archon-bot@users.noreply.github.com'
  GIT_COMMITTER_NAME = 'Archon Bot'
  GIT_COMMITTER_EMAIL = 'archon-bot@users.noreply.github.com'
  # Let corepack download the project-pinned pnpm/yarn non-interactively
  # (auto-fix-conflict regenerates pnpm/yarn lockfiles via corepack).
  COREPACK_ENABLE_DOWNLOAD_PROMPT = '0'
  # Speed up the many `npm ci`/`npm install` runs the Dependabot pipeline does
  # in worktrees. npm reads npm_config_* env vars: skip the post-install audit
  # (a network round-trip + full-tree scan) and funding output, and prefer the
  # local cache (falls back to network on a miss, so safe even when cold).
  npm_config_audit = 'false'
  npm_config_fund = 'false'
  npm_config_prefer_offline = 'true'
  # Persist npm's cache on the mounted volume (see [mounts]) so `npm ci` reuses
  # downloaded tarballs across deploys/restarts instead of re-downloading the
  # full tree each time. Entrypoint creates + chowns /cache/npm for appuser.
  npm_config_cache = '/cache/npm'

# Persistent cache volume (npm tarball cache). Single volume for the single
# always-on machine. Create once: `fly volumes create npm_cache --region ord --size 3`.
[mounts]
  source = 'npm_cache'
  destination = '/cache'

[http_service]
  internal_port = 3000
  force_https = true
  # Webhook receivers (the webhook-host subsystem) run on this same machine and
  # must not miss deliveries, so keep one machine always on (no idle-stop).
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

# Second public service for the webhook-host dispatcher. Fly terminates TLS at
# the edge on :8443 and forwards to the dispatcher on internal port 9000, which
# path-routes to each webhook server (e.g. /dependabot). GitHub webhook URLs
# support custom ports: https://archon-sandbox.fly.dev:8443/dependabot
[[services]]
  internal_port = 9000
  protocol = 'tcp'
  processes = ['app']

  [[services.ports]]
    port = 8443
    handlers = ['tls', 'http']

[[vm]]
  # Sized for running the webhook-host + concurrent Dependabot pipeline runs
  # (npm install/build/test in worktrees), which is memory- and CPU-hungry.
  # shared-cpu-4x. (Was 1gb/1 → 2gb/2 → 4gb/4.)
  memory = '4gb'
  cpus = 4
